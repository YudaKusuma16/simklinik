name: simrs

services:
  #Database Service (MySQL 8.0)
  db:
    image: mysql:8.0
    container_name: simrs_db
    restart: unless-stopped
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: simrs_db
      MYSQL_USER: simrs
      MYSQL_PASSWORD: simrs123
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - simrs_network

  #Backend
  backend:
    container_name: simrs_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: "SIM RS"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "base64:MDzhtoB6nExr/MLyxedGjhNT7S9eZwltMQcZtn88e6M="
      APP_URL: "http://localhost:8000"
      FRONTEND_URL: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: simrs_db
      DB_USERNAME: simrs
      DB_PASSWORD: simrs123
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      RUN_SEEDER: "false"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    networks:
      - simrs_network

  #Frontend
  frontend:
    container_name: simrs_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_URL: http://backend:80
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - simrs_network

  #phpmyadmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: simrs_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - simrs_network

volumes:
  db_data:
    driver: local
  backend_vendor:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  simrs_network:
    driver: bridge
